<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>朋友圈文案侠 ✨ AI文案生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0b;
            --bg-card: #1a1a1c;
            --bg-input: #252528;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --text-muted: #666666;
            --gradient-purple: #8b5cf6;
            --gradient-pink: #ec4899;
            --gradient-gold: #f59e0b;
            --gradient-start: #8b5cf6;
            --gradient-mid: #ec4899;
            --gradient-end: #f59e0b;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景渐变 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 400px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-mid), var(--gradient-end));
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink), var(--gradient-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 配额显示 */
        .quota-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            padding: 12px 20px;
            background: var(--bg-card);
            border-radius: 20px;
            display: inline-flex;
            margin-left: 50%;
            transform: translateX(-50%);
        }

        .quota-icon {
            font-size: 18px;
        }

        .quota-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .quota-count {
            color: var(--gradient-pink);
            font-weight: 600;
        }

        .quota-pro {
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink));
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片通用样式 */
        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 场景选择 */
        .scene-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .scene-item {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .scene-item:hover {
            transform: translateY(-2px);
            border-color: var(--gradient-pink);
        }

        .scene-item.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
            border-color: var(--gradient-pink);
        }

        .scene-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .scene-name {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 风格选择 */
        .style-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .style-item {
            background: var(--bg-input);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .style-item:hover {
            border-color: var(--gradient-purple);
        }

        .style-item.active {
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink));
            color: white;
        }

        /* 关键词输入 */
        .keyword-input {
            width: 100%;
            background: var(--bg-input);
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .keyword-input:focus {
            border: 2px solid var(--gradient-purple);
        }

        .keyword-input::placeholder {
            color: var(--text-muted);
        }

        /* 生成按钮 */
        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink), var(--gradient-gold));
            color: white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .generate-btn .icon {
            font-size: 20px;
        }

        /* 朋友圈预览卡片 */
        .moment-preview {
            background: #1a1a1c;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .moment-header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 12px;
        }

        .moment-avatar {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .moment-user {
            flex: 1;
        }

        .moment-username {
            font-size: 15px;
            font-weight: 600;
            color: #181818;
        }

        .moment-time {
            font-size: 12px;
            color: #999;
        }

        .moment-content {
            padding: 0 16px 12px;
            font-size: 15px;
            line-height: 1.6;
            color: #181818;
        }

        .moment-emojis {
            font-size: 20px;
            margin-top: 8px;
        }

        .moment-image {
            padding: 0 16px 12px;
        }

        .moment-image-placeholder {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
            border-radius: 12px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 48px;
        }

        .moment-image-text {
            font-size: 14px;
            margin-top: 8px;
            color: var(--text-secondary);
        }

        .moment-footer {
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
        }

        .moment-location {
            font-size: 12px;
            color: #576b95;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .moment-actions {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .moment-action {
            font-size: 13px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .moment-likes {
            padding: 0 16px 8px;
        }

        .moment-like-item {
            font-size: 13px;
            color: #576b95;
        }

        /* 结果区域 */
        .results-area {
            margin-top: 20px;
        }

        .result-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .result-item:hover {
            border-color: var(--gradient-purple);
            transform: translateY(-2px);
        }

        .result-item.selected {
            border-color: var(--gradient-pink);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
        }

        .result-content {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .result-emojis {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .result-reply {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .result-reply-label {
            color: var(--gradient-pink);
            margin-right: 6px;
        }

        .result-location {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .copy-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--gradient-pink);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .result-item.copied .copy-hint {
            opacity: 1;
        }

        .result-number {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            background: var(--bg-input);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 11, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-text {
            font-size: 18px;
            color: var(--text-primary);
            margin-top: 20px;
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink), var(--gradient-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-left: 3px solid #ef4444;
        }

        .toast.success {
            border-left: 3px solid #22c55e;
        }

        /* Pro升级提示 */
        .pro-banner {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
            border: 1px solid var(--gradient-pink);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .pro-banner-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pro-banner-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .pro-btn {
            background: linear-gradient(135deg, var(--gradient-purple), var(--gradient-pink));
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pro-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }

        /* 移动端优化 */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .scene-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .scene-item {
                padding: 12px 4px;
            }

            .scene-icon {
                font-size: 24px;
            }

            .scene-name {
                font-size: 10px;
            }

            .card {
                padding: 16px;
                border-radius: 16px;
            }

            .card-title {
                font-size: 14px;
            }

            .style-item {
                padding: 6px 12px;
                font-size: 12px;
            }

            .generate-btn {
                padding: 14px;
                font-size: 15px;
            }

            .header {
                padding: 20px 0;
            }

            .logo {
                font-size: 26px;
            }
        }

        /* 文字逐字浮现动画 */
        @keyframes charReveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .char-reveal {
            display: inline;
        }

        .char-reveal span {
            display: inline-block;
            animation: charReveal 0.3s ease forwards;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1 class="logo">朋友圈文案侠 ✨</h1>
            <p class="tagline">拍照配文不求人，AI帮你写出让人点赞的朋友圈</p>
        </header>

        <!-- 配额显示 -->
        <div class="quota-bar">
            <span class="quota-icon">⚡</span>
            <span class="quota-text">
                本月剩余 <span class="quota-count" id="quotaCount">5</span> 次
            </span>
            <span class="quota-pro" id="proBadge" style="display: none;">PRO</span>
        </div>

        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 左侧：选择区 -->
            <div class="left-panel">
                <!-- 场景选择 -->
                <div class="card">
                    <h3 class="card-title">🎯 选择场景</h3>
                    <div class="scene-grid" id="sceneGrid">
                        <div class="scene-item active" data-scene="food">
                            <div class="scene-icon">🍜</div>
                            <div class="scene-name">美食打卡</div>
                        </div>
                        <div class="scene-item" data-scene="travel">
                            <div class="scene-icon">✈️</div>
                            <div class="scene-name">旅行出游</div>
                        </div>
                        <div class="scene-item" data-scene="fitness">
                            <div class="scene-icon">💪</div>
                            <div class="scene-name">健身运动</div>
                        </div>
                        <div class="scene-item" data-scene="pet">
                            <div class="scene-icon">🐱</div>
                            <div class="scene-name">萌宠日常</div>
                        </div>
                        <div class="scene-item" data-scene="work">
                            <div class="scene-icon">💼</div>
                            <div class="scene-name">职场日常</div>
                        </div>
                        <div class="scene-item" data-scene="party">
                            <div class="scene-icon">🎉</div>
                            <div class="scene-name">聚会社交</div>
                        </div>
                        <div class="scene-item" data-scene="daily">
                            <div class="scene-icon">☕</div>
                            <div class="scene-name">日常心情</div>
                        </div>
                        <div class="scene-item" data-scene="love">
                            <div class="scene-icon">💕</div>
                            <div class="scene-name">恋爱甜蜜</div>
                        </div>
                    </div>
                </div>

                <!-- 风格选择 -->
                <div class="card">
                    <h3 class="card-title">🎨 选择风格</h3>
                    <div class="style-grid" id="styleGrid">
                        <div class="style-item active" data-style="literary">文艺清新</div>
                        <div class="style-item" data-style="humor">搞笑幽默</div>
                        <div class="style-item" data-style="cold">高冷简约</div>
                        <div class="style-item" data-style="warm">温暖治愈</div>
                        <div class="style-item" data-style="vaush">凡尔赛</div>
                        <div class="style-item" data-style="poet">朋友圈诗人</div>
                    </div>
                </div>

                <!-- 自定义关键词 -->
                <div class="card">
                    <h3 class="card-title">✏️ 自定义关键词（可选）</h3>
                    <input type="text" class="keyword-input" id="keywordInput" placeholder="例如：火锅、咖啡、猫猫、加班...">
                </div>

                <!-- 生成按钮 -->
                <button class="generate-btn" id="generateBtn">
                    <span class="icon">✨</span>
                    <span>生成文案</span>
                </button>

                <!-- Pro升级提示 -->
                <div class="pro-banner" id="proBanner" style="display: none;">
                    <div class="pro-banner-title">升级 Pro 解锁无限创意</div>
                    <div class="pro-banner-text">¥19/月，无限次使用，尊享专属功能</div>
                    <button class="pro-btn" onclick="upgradeToPro()">立即升级</button>
                </div>
            </div>

            <!-- 右侧：预览区 -->
            <div class="right-panel">
                <!-- 朋友圈预览 -->
                <div class="card">
                    <h3 class="card-title">📱 朋友圈预览</h3>
                    <div class="moment-preview" id="momentPreview">
                        <div class="moment-header">
                            <div class="moment-avatar">🙋</div>
                            <div class="moment-user">
                                <div class="moment-username">文案侠</div>
                                <div class="moment-time">刚刚</div>
                            </div>
                        </div>
                        <div class="moment-content" id="previewContent">
                            选择场景和风格<br>点击生成开始创作
                        </div>
                        <div class="moment-emojis" id="previewEmojis"></div>
                        <div class="moment-image">
                            <div class="moment-image-placeholder" id="previewImage">
                                📷
                                <div class="moment-image-text">配图建议</div>
                            </div>
                        </div>
                        <div class="moment-likes">
                            <span class="moment-like-item">❤️ 赞</span>
                        </div>
                        <div class="moment-footer">
                            <div class="moment-location" id="previewLocation">
                                📍 朋友圈
                            </div>
                            <div class="moment-actions">
                                <div class="moment-action">👍 赞</div>
                                <div class="moment-action">💬 评论</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 生成结果 -->
                <div class="results-area" id="resultsArea"></div>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div style="font-size: 60px;">💭</div>
        <div class="loading-text">
            灵感涌现<span class="loading-dots"></span>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span id="toastIcon">✓</span>
        <span id="toastText">复制成功</span>
    </div>

    <script>
        // 状态管理
        const state = {
            selectedScene: 'food',
            selectedStyle: 'literary',
            remainingQuota: 5,
            isPro: false,
            results: [],
            selectedIndex: 0
        };

        // DOM元素
        const sceneGrid = document.getElementById('sceneGrid');
        const styleGrid = document.getElementById('styleGrid');
        const keywordInput = document.getElementById('keywordInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultsArea = document.getElementById('resultsArea');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const quotaCount = document.getElementById('quotaCount');
        const proBadge = document.getElementById('proBadge');
        const proBanner = document.getElementById('proBanner');

        // 初始化场景选择
        sceneGrid.addEventListener('click', (e) => {
            const item = e.target.closest('.scene-item');
            if (item) {
                document.querySelectorAll('.scene-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                state.selectedScene = item.dataset.scene;
                updatePreview();
            }
        });

        // 初始化风格选择
        styleGrid.addEventListener('click', (e) => {
            const item = e.target.closest('.style-item');
            if (item) {
                document.querySelectorAll('.style-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                state.selectedStyle = item.dataset.style;
            }
        });

        // 更新预览
        function updatePreview() {
            const sceneIcons = {
                food: '🍜',
                travel: '✈️',
                fitness: '💪',
                pet: '🐱',
                work: '💼',
                party: '🎉',
                daily: '☕',

        // 显示Toast
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toastText.textContent = message;
            toastIcon.textContent = type === 'success' ? '✓' : '✕';
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 文字逐字浮现动画
        function animateTextReveal(element, text) {
            element.innerHTML = '';
            let html = '';
            for (let i = 0; i < text.length; i++) {
                html += `<span style="animation-delay: ${i * 0.05}s">${text[i]}</span>`;
            }
            element.innerHTML = html;
        }

        // 复制文案
        async function copyResult(index) {
            const result = state.results[index];
            if (!result) return;
            
            const fullText = `${result.content}\n${result.emojis.join('')}\n\n📍${result.location_text}\n\n💬自嘲回复: ${result.self_deprecating_reply}`;
            
            try {
                await navigator.clipboard.writeText(fullText);
                
                // 视觉反馈
                const item = document.querySelectorAll('.result-item')[index];
                item.classList.add('copied', 'selected');
                document.querySelectorAll('.result-item').forEach((el, i) => {
                    if (i !== index) el.classList.remove('selected');
                });
                
                // 更新预览
                document.getElementById('previewContent').textContent = result.content;
                document.getElementById('previewEmojis').textContent = result.emojis.join('');
                document.getElementById('previewLocation').textContent = '📍 ' + result.location_text;
                
                showToast('复制成功，快去发朋友圈吧！');
            } catch (err) {
                showToast('复制失败，请手动选择', 'error');
            }
        }

        // 生成文案
        async function generateMoment() {
            if (state.remainingQuota <= 0 && !state.isPro) {
                proBanner.style.display = 'block';
                showToast('本月免费次数已用完', 'error');
                return;
            }

            const keyword = keywordInput.value.trim();
            
            // 显示加载
            loadingOverlay.classList.add('active');
            generateBtn.disabled = true;
            
            // 模拟API调用（实际项目替换为真实API）
            try {
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // 使用内置生成器
                const results = generateLocal(state.selectedScene, state.selectedStyle, keyword, 3);
                
                state.results = results;
                state.remainingQuota--;
                
                // 更新配额显示
                quotaCount.textContent = state.isPro ? '∞' : state.remainingQuota;
                
                if (state.remainingQuota <= 0 && !state.isPro) {
                    proBanner.style.display = 'block';
                }
                
                // 渲染结果
                renderResults(results);
                
                // 更新预览为第一条
                if (results.length > 0) {
                    updatePreviewFromResult(results[0]);
                }
                
            } catch (err) {
                showToast('生成失败，请重试', 'error');
            } finally {
                loadingOverlay.classList.remove('active');
                generateBtn.disabled = false;
            }
        }

        // 本地生成器（备用）
        function generateLocal(scene, style, keyword, count) {
            const templates = getTemplates(scene, style);
            const results = [];
            const usedIndices = [];
            
            for (let i = 0; i < Math.min(count, templates.length); i++) {
                let idx;
                do {
                    idx = Math.floor(Math.random() * templates.length);
                } while (usedIndices.includes(idx) && usedIndices.length < templates.length);
                usedIndices.push(idx);
                
                const content = keyword ? templates[idx].replace('{keyword}', keyword) : templates[idx];
                const emojis = getEmojis(scene);
                const replies = [
                    "谢谢，会继续努力的",
                    "滤镜比较重要",
                    "主要靠后期",
                    "哈哈，被发现了",
                    "主要靠修图"
                ];
                
                results.push({
                    content,
                    emojis,
                    self_deprecating_reply: replies[Math.floor(Math.random() * replies.length)],
                    location_text: getLocation(scene),
                    tips: `建议搭配${emojis.length}个emoji，或使用实拍图+滤镜`
                });
            }
            
            return results;
        }
